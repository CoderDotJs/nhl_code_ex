[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-algorithm-samples"
version = "0.1.0"
description = "Algorithmic implementations in pure Python: A* Search & O(1) LRU Cache."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["algorithms", "graph-search", "astar", "lru-cache", "data-structures"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.pytest.ini_options]
testpaths = ["sample_1_astar", "sample_2_lru_cache"]
python_files = ["test_*.py"]
